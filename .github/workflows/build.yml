
name: POT SonarQube Analysis

on:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build and analyze

    # Windows Server 2019 self-hosted runner
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      # Checkout repository source code
      - name: Checkout POT Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Validate internal SonarQube connectivity
      - name: Verify SonarQube Connection
        shell: powershell
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if (-not $env:SONAR_HOST_URL) {
            throw "SONAR_HOST_URL is not configured"
          }

          $url = "$($env:SONAR_HOST_URL.TrimEnd('/'))/api/system/status"

          $response = Invoke-RestMethod `
            -Uri $url `
            -TimeoutSec 30

          Write-Host "SonarQube status: $($response.status)"

          if ($response.status -ne "UP") {
            throw "SonarQube is not operational"
          }

      # Execute SonarQube static code analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
